name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          if [ -f LauncherLigero.zip ]; then
            unzip -q -o LauncherLigero.zip -d _src
            echo "PROJECT_DIR=_src/LauncherLigero" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon
      - name: Preparar APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk LauncherLigero.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Launcher Ligero ${{ github.run_number }}
          files: LauncherLigero.apk
